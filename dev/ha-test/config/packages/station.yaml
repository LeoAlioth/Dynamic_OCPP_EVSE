# A portable power station (the EcoFlow shape): a modulating load whose charge
# rate the engine writes to a `number` entity, with its own battery.
#
# The one device here whose draw is a continuous variable rather than on/off,
# so it is the one that exercises the modulating path: the engine sizes it
# against a pool, writes a watts figure, and reads back what it actually pulls.
#
# Its AC input FOLLOWS the charge speed, but not instantly: it closes a share
# of the remaining gap every 5 seconds (the ramp-rate knob), which is why the
# engine will not trust a draw until it has settled. It is
# also clamped to 0 once the pack is full, because a station that has finished
# charging stops drawing however high the register is set - and an engine that
# budgets for a draw that never arrives is a bug worth being able to see.
#
# The register range goes to 11 kW so the same device can stand in for an EVSE:
# a modulating load whose draw is a continuous variable is the shape both have,
# and the realistic ceiling belongs in Load Juggler's own min/max charge power
# fields, which is where a real deployment sets it too.
#
# Configure it in Load Juggler as: charge speed = number.sim_station_charge_speed,
# reserve = number.sim_station_reserve, battery level = sensor.sim_station_battery,
# AC input = sensor.sim_station_ac_input.

input_number:
  sim_station_charge_speed_raw:
    # The register itself. The engine writes it through the template number
    # below; this is where the value lands.
    name: Station charge speed register
    min: 0
    max: 11000
    step: 50
    unit_of_measurement: W
    icon: mdi:battery-charging-high
  sim_station_reserve_raw:
    name: Station reserve register
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-lock
  sim_station_ramp:
    # How much of the remaining gap the load closes every 5 seconds. 100 means
    # it arrives next sample, which is a converter; 50 takes a few samples,
    # which is a car - and the slow case is the one `draw_settled` exists for,
    # so it is the default.
    name: Station ramp rate
    min: 10
    max: 100
    step: 10
    initial: 50
    unit_of_measurement: "%"
    icon: mdi:chart-timeline-variant

  sim_station_battery:
    name: Station battery level
    min: 0
    max: 100
    step: 1
    initial: 50
    unit_of_measurement: "%"
    icon: mdi:battery-60

input_select:
  sim_station_phase:
    # The full mask set, matching the plug and the tank. Load Juggler's own
    # station picker currently offers A/B/C only, though its engine handles any
    # mask - so the multi-phase options here are ready for the day that picker
    # catches up, and meanwhile a mask the engine was told nothing about is a
    # wiring/belief mismatch you can deliberately create.
    name: Station wired to phase
    options: ["A", "B", "C", "AB", "BC", "AC", "ABC"]
    initial: "C"
    icon: mdi:transmission-tower

template:
  - number:
      # The two registers the engine writes. `number`, not `input_number`: the
      # station's pickers offer that domain only, as a real station's
      # integration provides.
      - name: Sim station charge speed
        unique_id: sim_station_charge_speed
        unit_of_measurement: W
        min: 0
        max: 11000
        step: 50
        state: "{{ states('input_number.sim_station_charge_speed_raw') | float(0) }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.sim_station_charge_speed_raw
            data:
              value: "{{ value }}"
      - name: Sim station reserve
        unique_id: sim_station_reserve
        unit_of_measurement: "%"
        min: 0
        max: 100
        step: 5
        state: "{{ states('input_number.sim_station_reserve_raw') | float(0) }}"
        set_value:
          - action: input_number.set_value
            target:
              entity_id: input_number.sim_station_reserve_raw
            data:
              value: "{{ value }}"

  - sensor:
      - name: Sim station battery
        unique_id: sim_station_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ states('input_number.sim_station_battery') | float(0) | round(0) }}"

      # The register's target, before the converter gets to it.
      - name: Sim station input target
        unique_id: sim_station_input_target
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {{ 0 if states('input_number.sim_station_battery') | float(0) >= 100
             else states('input_number.sim_station_charge_speed_raw') | float(0) }}

      - name: Sim managed station a
        unique_id: sim_managed_station_a
        device_class: power
        unit_of_measurement: W
        state: >
          {% set mask = states('input_select.sim_station_phase') %}
          {{ (states('sensor.sim_station_draw') | float(0) / mask | length)
             | round(1) if 'A' in mask else 0 }}
      - name: Sim managed station b
        unique_id: sim_managed_station_b
        device_class: power
        unit_of_measurement: W
        state: >
          {% set mask = states('input_select.sim_station_phase') %}
          {{ (states('sensor.sim_station_draw') | float(0) / mask | length)
             | round(1) if 'B' in mask else 0 }}
      - name: Sim managed station c
        unique_id: sim_managed_station_c
        device_class: power
        unit_of_measurement: W
        state: >
          {% set mask = states('input_select.sim_station_phase') %}
          {{ (states('sensor.sim_station_draw') | float(0) / mask | length)
             | round(1) if 'C' in mask else 0 }}

  # ------------------------------------------------------------------
  # What it really pulls - the engine's power monitor for this load.
  #
  # A first-order ramp: it closes `sim_station_ramp` percent of the remaining
  # gap every 5 seconds, and snaps the last 50 W so it arrives rather than
  # creeping at it forever. 50 W is well under anything the engine reacts to,
  # and without the snap a halving ramp never gets there - it just runs out of
  # patience before you do.
  #
  # The point of ramping at all is that the engine must hold a load's whole
  # permit against the pools until the draw settles: a modulating load that
  # arrives instantly would make that logic untestable. The binary loads (plug,
  # tank element) are deliberately NOT ramped - a resistive load really does
  # step the instant its relay closes.
  - trigger:
      - trigger: time_pattern
        seconds: "/5"
    sensor:
      - name: Sim station draw
        unique_id: sim_station_draw
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set target = states('sensor.sim_station_input_target') | float(0) %}
          {% if is_state('input_boolean.sim_lag', 'off') or this is none %}
            {{ target }}
          {% else %}
            {% set prev = this.state | float(target) %}
            {% set rate = states('input_number.sim_station_ramp') | float(50) / 100 %}
            {{ target if (target - prev) | abs < 50
               else (prev + (target - prev) * rate) | round(0) }}
          {% endif %}

  # ------------------------------------------------------------------
  # What the station REPORTS drawing, which lags what it is drawing.
  #
  # Two stages on purpose, and they are different physics. The ramp above is
  # the converter genuinely taking a few seconds to reach its setpoint. This is
  # the METER on it, and like the site CTs it is 5–10 s behind. Collapsing the
  # two - an instantaneous monitor beside a lagging CT - is what let the
  # feedback loop remove a draw the CT had not yet seen, and an importing phase
  # read as exporting for one sample.
  - trigger:
      - trigger: time_pattern
        seconds: "/5"
    sensor:
      - name: Sim station ac input
        unique_id: sim_station_ac_input
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set now = states('sensor.sim_station_draw') | float(0) %}
          {% if is_state('input_boolean.sim_lag', 'on') and this is not none %}
            {{ this.attributes.get('pending', now) | float(now) }}
          {% else %}
            {{ now }}
          {% endif %}
        attributes:
          pending: "{{ states('sensor.sim_station_draw') | float(0) }}"
