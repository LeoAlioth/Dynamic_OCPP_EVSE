title: Simulator
views:
- title: Site
  path: site
  icon: mdi:transmission-tower
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: power-sankey
      title: Where the power is going
      max_devices: 6
  - type: grid
    cards:
    - type: markdown
      content: 'The grid CTs are **derived**: `grid = household + managed loads − inverter`. Move a slider
        and the meter follows, the same way it does on a real site. There is no way to set an impossible
        state.


        They also **lag**, by 5 to 10 seconds — which is what the engine''s smoothing, its settling test
        and its over-commitment all live or die on. Turn the lag off to isolate an engine question from
        a timing one.

        '
    - type: entities
      title: What the house draws
      entities:
      - input_number.sim_household_a
      - input_number.sim_household_b
      - input_number.sim_household_c
  - type: grid
    cards:
    - type: entities
      title: What the inverter makes
      entities:
      - input_number.sim_solar
      - input_select.sim_inverter_phases
      - input_number.sim_battery_soc
      - input_number.sim_battery_power
      - input_number.sim_voltage
  - type: grid
    cards:
    - type: entities
      title: The truth
      entities:
      - sensor.sim_grid_instant_a
      - sensor.sim_grid_instant_b
      - sensor.sim_grid_instant_c
      - sensor.sim_grid_net_power
      - type: divider
      - sensor.sim_site_load_a
      - sensor.sim_site_load_b
      - sensor.sim_site_load_c
    - type: entities
      title: The meter the engine reads
      entities:
      - input_boolean.sim_lag
      - type: divider
      - sensor.sim_grid_current_a
      - sensor.sim_grid_current_b
      - sensor.sim_grid_current_c
      - entity: sensor.sim_ct_lag_error
        name: How far behind the meter is
  - type: grid
    column_span: 3
    cards:
    - type: history-graph
      title: The last hour
      hours_to_show: 1
      entities:
      - sensor.sim_grid_net_power
      - sensor.sim_solar_power
      - entity: sensor.sim_ct_lag_error
        name: Meter lag
- title: Loads
  path: loads
  icon: mdi:power-plug
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: markdown
      content: 'Every load appears **twice**: what Load Juggler decides, and what the hardware does about
        it. A permit the device ignores, or a draw the engine never granted, shows up side by side instead
        of having to be pieced together from two pages.


        Two figures are easy to conflate. **Permitted** is what the engine grants the device to draw.
        **Counted against the budget** is its measured footprint — what other loads are budgeted against
        — and for a settled device drawing under its permit the two differ, deliberately.


        **Headroom A/B/C** is computed from *unmanaged* consumption, so on a phase already carrying one
        of our loads it reads higher than what is physically left there. The site''s Overview page (⚙
        → Overview) shows the allocator''s actual pools beside it.'
  - type: grid
    cards:
    - type: entities
      title: Site
      entities:
      - select.site_load_management_distribution_mode
      - number.site_load_management_max_import_power
      - number.site_load_management_power_buffer
      - &id001
        type: divider
      - sensor.site_load_management_status
      - entity: sensor.site_load_management_current_grid_power
        name: Grid (− exporting)
      - entity: sensor.site_load_management_current_solar_power
        name: Solar
      - entity: sensor.site_load_management_current_managed_power
        name: Managed loads drawing
      - *id001
      - entity: sensor.site_load_management_remaining_current_a
        name: Headroom A
      - entity: sensor.site_load_management_remaining_current_b
        name: Headroom B
      - entity: sensor.site_load_management_remaining_current_c
        name: Headroom C
      - *id001
      - entity: sensor.site_load_management_grid_remaining_current
        name: Grid pool
      - entity: sensor.site_load_management_solar_remaining_current
        name: Solar pool
      - entity: sensor.site_load_management_inverter_remaining_current
        name: Inverter pool
  - type: grid
    cards:
    - type: entities
      title: Smart plug — the engine
      entities:
      - select.smart_load_operating_mode
      - switch.smart_load_dynamic_control
      - entity: number.smart_load_device_power
        name: Rated power
      - *id001
      - sensor.smart_load_status
      - entity: sensor.smart_load_available_current
        name: Permitted
      - entity: sensor.smart_load_allocated_current
        name: Counted against the budget
      - entity: sensor.smart_load_effective_priority
        name: Served in position
    - type: entities
      title: Smart plug — the hardware
      entities:
      - entity: switch.sim_plug
        name: Relay (the engine writes this)
      - entity: input_number.sim_plug_power
        name: Draw when on
      - entity: input_select.sim_plug_phase
        name: Wired to phase
      - entity: sensor.sim_plug_power
        name: Power monitor
  - type: grid
    cards:
    - type: entities
      title: Power station — the engine
      entities:
      - select.power_station_operating_mode
      - switch.power_station_dynamic_control
      - switch.power_station_storm_reserve
      - *id001
      - entity: number.power_station_minimum_charge_power
        name: Minimum charge power
      - entity: number.power_station_maximum_charge_power
        name: Maximum charge power
      - entity: number.power_station_normal_reserve
        name: Normal reserve
      - entity: number.power_station_storm_reserve
        name: Storm reserve
      - *id001
      - sensor.power_station_status
      - entity: sensor.power_station_available_current
        name: Permitted
      - entity: sensor.power_station_allocated_current
        name: Counted against the budget
      - entity: sensor.power_station_effective_priority
        name: Served in position
    - type: entities
      title: Power station — the hardware
      entities:
      - entity: number.sim_station_charge_speed
        name: Charge register (engine writes)
      - entity: number.sim_station_reserve
        name: Reserve register (engine writes)
      - *id001
      - entity: input_number.sim_station_battery
        name: Pack level
      - entity: input_number.sim_station_ramp
        name: Ramp rate
      - entity: input_select.sim_station_phase
        name: Wired to phase
      - *id001
      - entity: sensor.sim_station_input_target
        name: Register target
      - entity: sensor.sim_station_ac_input
        name: What it actually pulls
  - type: grid
    column_span: 3
    cards:
    - type: entities
      title: Hot water tank — hardware only
      entities:
      - entity: climate.sim_water_tank
        name: Thermostat
      - entity: input_number.sim_tank_temperature
        name: Water temperature
      - entity: input_number.sim_tank_element_power
        name: Element power
      - entity: input_select.sim_tank_phase
        name: Wired to phase
      - entity: input_boolean.sim_tank_element
        name: Element (thermostat writes)
      - entity: sensor.sim_tank_power
        name: Power monitor
